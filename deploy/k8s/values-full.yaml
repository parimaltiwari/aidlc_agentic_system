      tensorParallelSize: 1
      quantization: ""
      gpu: 1
      port: 8000
      nodeSelector: {}
      tolerations: []
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
      cache:
