        requests:
          cpu: "4"
          memory: 32Gi
          nvidia.com/gpu: "2"
        limits:
          cpu: "8"
          memory: 64Gi
          nvidia.com/gpu: "2"
      cache:
        enabled: true
        size: 200Gi
        storageClassName: ""
    - name: embed
      enabled: true
