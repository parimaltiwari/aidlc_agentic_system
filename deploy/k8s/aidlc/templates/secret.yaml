{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aidlc.secretName" . }}
  labels:
    {{- include "aidlc.labels" . | nindent 4 }}
type: Opaque
stringData:
  AIDLC_DATABASE_URL: {{ .Values.secrets.databaseURL | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  HF_TOKEN: {{ .Values.secrets.hfToken | quote }}
{{- end }}
