        enabled: true
        size: 200Gi
        storageClassName: ""
    - name: reasoning
      enabled: true
      replicas: 1
      model: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
      tensorParallelSize: 2
      quantization: awq
